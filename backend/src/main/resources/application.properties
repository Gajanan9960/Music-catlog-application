spring.application.name=musiccatalog

# Render dynamically assigns a PORT environment variable. We default to 8080 if not set.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_catalog}
spring.datasource.username=${DB_USERNAME:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:default-insecure-secret-for-local-dev-only-change-in-prod-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
gemini.api-key=${GEMINI_API_KEY:}
